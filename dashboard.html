<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Check Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="common.js"></script>
<style>
  /* Light only: the app always uses its light theme */
  :root {
    --bg: #EDEFF2;
    --surface: #FFFFFF;
    --surface-2: #E2E5EA;
    --surface-3: #F5F6F8;
    --ink: #14171C;
    --ink-dim: #676D78;
    --ink-muted: #8A909A;
    --border: #D4D8DE;
    --grid: #E6E8EC;
    --accent: #E1550C;
    --accent-2: #C4470A;
    --accent-bg: #FCE9DE;
    --accent-ink: #FFFFFF;
    --good: #0F8F72;
    --good-bg: #DCEFE9;
    --bad: #C4392E;
    --bad-bg: #FAE5E2;
    --warn: #9A6A00;
    --warn-bg: #FBF0D5;
    --radius-lg: 18px;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(15,17,20,0.05), 0 10px 28px -14px rgba(15,17,20,0.22);
    --shadow-lg: 0 2px 4px rgba(15,17,20,0.06), 0 20px 44px -18px rgba(15,17,20,0.3);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button, select, input { font-family: inherit; font-size: inherit; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .display { font-family: "Space Grotesk", "Inter", sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  body.signed-out .shell { visibility: hidden; }
  aside.side { background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  .glyph { width: 36px; height: 36px; border-radius: 10px; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand b { font-family: "Space Grotesk", sans-serif; font-size: 17px; display: block; }
  .brand small { color: var(--ink-dim); font-size: 11.5px; }
  nav.side-nav { display: flex; flex-direction: column; gap: 2px; }
  nav.side-nav button { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 9px; border: none; background: none; color: var(--ink-dim); font-weight: 600; cursor: pointer; text-align: left; }
  nav.side-nav button svg { width: 18px; height: 18px; flex-shrink: 0; }
  nav.side-nav button:hover { background: var(--surface-3); color: var(--ink); }
  nav.side-nav button.active { background: var(--accent-bg); color: var(--accent-2); }
  nav.side-nav .nav-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-muted); font-weight: 700; padding: 14px 12px 4px; }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .me { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--radius); background: var(--surface-3); border: 1px solid var(--border); cursor: pointer; text-align: left; width: 100%; }
  .me:hover { border-color: var(--ink-muted); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .me .who { min-width: 0; flex: 1; }
  .me .who b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .me .who span { font-size: 11.5px; color: var(--ink-dim); }
  .side-link { font-size: 12px; color: var(--ink-dim); text-decoration: none; padding: 0 8px; }
  .side-link:hover { color: var(--ink); }

  main.content { padding: 22px 28px 60px; min-width: 0; }
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .topbar h1 { margin: 0; font-family: "Space Grotesk", sans-serif; font-size: 26px; letter-spacing: -.01em; }
  .topbar .sub { color: var(--ink-dim); font-size: 13px; margin-top: 3px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--good); font-weight: 600; background: var(--good-bg); padding: 4px 10px; border-radius: 100px; }
  .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); animation: pulse 2s ease-in-out infinite; }
  .live.off { color: var(--ink-dim); background: var(--surface-2); }
  .live.off::before { background: var(--ink-muted); animation: none; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }

  /* ---------- cards & tiles ---------- */
  .grid { display: grid; gap: 16px; }
  .grid.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 16px; }
  .grid.two { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); margin-bottom: 16px; }
  .grid.half { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
  .card h2 { margin: 0; font-size: 14.5px; font-family: "Space Grotesk", sans-serif; }
  .card .card-sub { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .tile .label { font-size: 12px; color: var(--ink-dim); font-weight: 600; }
  .tile .value { font-family: "Space Grotesk", sans-serif; font-size: 32px; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tile .value small { font-size: 16px; color: var(--ink-dim); font-weight: 600; margin-left: 2px; }
  .tile .foot { font-size: 12px; color: var(--ink-dim); margin-top: 4px; }
  .meter { height: 8px; border-radius: 5px; background: var(--surface-2); margin-top: 12px; overflow: hidden; }
  .meter > div { height: 100%; border-radius: 5px; background: var(--accent); transition: width .4s ease; }

  /* ---------- charts ---------- */
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart .axis-label { fill: var(--ink-muted); font-size: 11px; font-family: "Inter", sans-serif; }
  .chart .gridline { stroke: var(--grid); stroke-width: 1; }
  .chart .baseline { stroke: var(--border); stroke-width: 1; }
  .chart .bar { fill: var(--accent); pointer-events: none; }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .hit:hover + .bar, .chart .bar.hover { fill: var(--accent-2); }
  .tooltip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 7px 10px; border-radius: 8px; white-space: nowrap; box-shadow: var(--shadow-lg); transform: translate(-50%, calc(-100% - 10px)); z-index: 5; }
  .tooltip b { font-weight: 700; }
  .empty { color: var(--ink-dim); font-size: 13px; text-align: center; padding: 34px 10px; }

  .hbars { display: flex; flex-direction: column; gap: 12px; }
  .hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; position: relative; }
  .hbar .name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .val { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hbar .track { grid-column: 1 / -1; height: 10px; }
  .hbar .fill { height: 100%; border-radius: 0 4px 4px 0; background: var(--accent); min-width: 3px; }
  .hbar:hover .fill { background: var(--accent-2); }

  /* ---------- lists & tables ---------- */
  .feed { display: flex; flex-direction: column; }
  .feed-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--grid); }
  .feed-row:last-child { border-bottom: none; }
  .feed-row .avatar { width: 30px; height: 30px; font-size: 12px; }
  .feed-row .what { font-size: 13px; line-height: 1.4; }
  .feed-row .what .muted { color: var(--ink-dim); }
  .feed-row .when { font-size: 12px; color: var(--ink-muted); white-space: nowrap; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .grow { flex: 1; min-width: 220px; }
  .input, select.input { padding: 9px 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); }
  .input:focus { outline: none; border-color: var(--accent); }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { border: none; background: none; padding: 7px 12px; border-radius: 7px; font-weight: 600; color: var(--ink-dim); cursor: pointer; font-size: 13px; }
  .seg button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  .table-card { padding: 0; overflow: hidden; }
  .table-scroll { overflow: auto; max-height: calc(100vh - 230px); }
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th { position: sticky; top: 0; background: var(--surface-3); text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-dim); font-weight: 700; padding: 11px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; z-index: 1; }
  table.data td { padding: 10px 14px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  table.data tr:last-child td { border-bottom: none; }
  table.data tbody tr:hover td { background: var(--surface-3); }
  table.data td.r, table.data th.r { text-align: right; }
  table.data td.dim { color: var(--ink-dim); }
  .table-foot { padding: 10px 14px; font-size: 12px; color: var(--ink-dim); border-top: 1px solid var(--border); background: var(--surface-3); }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 100px; white-space: nowrap; }
  .pill.good { background: var(--good-bg); color: var(--good); }
  .pill.idle { background: var(--surface-2); color: var(--ink-dim); }
  .pill.accent { background: var(--accent-bg); color: var(--accent-2); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.ink { background: var(--ink); color: var(--bg); }
  .qty-cell { font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 14px; }
  .qty-btn { font: inherit; background: none; border: 1px dashed transparent; border-radius: 6px; padding: 3px 8px; cursor: pointer; color: var(--ink); min-width: 48px; text-align: right; }
  .qty-btn:hover { border-color: var(--border); background: var(--surface); }
  .qty-btn.dash { color: var(--ink-muted); font-weight: 400; }
  .qty-edit { width: 90px; padding: 5px 8px; text-align: right; font-family: "IBM Plex Mono", monospace; font-weight: 700; border-radius: 6px; border: 1.5px solid var(--accent); }
  .qty-edit:focus { outline: none; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--bad); }
  .row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }

  /* ---------- buttons ---------- */
  .btn { padding: 9px 14px; border-radius: var(--radius-sm); border: 1.5px solid transparent; font-weight: 600; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 0 var(--accent-2); }
  .btn-primary:hover { background: var(--accent-2); }
  .btn-primary:disabled { opacity: .5; cursor: default; }
  .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--ink-muted); }
  .btn-danger { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
  .btn-sm { padding: 5px 10px; font-size: 12.5px; }
  .btn-block { width: 100%; justify-content: center; }

  /* ---------- count page ---------- */
  .scan-hero { position: relative; overflow: hidden; border-radius: var(--radius-lg); background: var(--ink); color: #fff; padding: 22px; box-shadow: var(--shadow-lg); }
  .scan-hero::before { content: ""; position: absolute; inset: 0; opacity: .5; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.09) 0 3px, transparent 3px 7px, rgba(255,255,255,.05) 7px 8px, transparent 8px 14px); }
  .scan-hero > * { position: relative; }
  .scan-hero h2 { margin: 0 0 4px; font-size: 15px; font-family: "Space Grotesk", sans-serif; }
  .scan-hero p { margin: 0 0 14px; color: rgba(255,255,255,.6); font-size: 13px; }
  .scan-form { display: flex; gap: 10px; }
  .scan-form input { flex: 1; min-width: 0; padding: 16px 18px; font-size: 20px; border-radius: var(--radius-sm); border: 1.5px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; font-family: "IBM Plex Mono", monospace; }
  .scan-form input::placeholder { color: rgba(255,255,255,.4); font-family: "Inter", sans-serif; }
  .scan-form input:focus { outline: none; border-color: var(--accent); }
  .scan-form button { padding: 0 22px; border-radius: var(--radius-sm); border: none; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
  .item-card { margin-top: 16px; border-left: 5px solid var(--ink-muted); }
  .item-card.found { border-left-color: var(--good); }
  .item-card.unknown, .item-card.extra { border-left-color: var(--accent); }
  .item-card .code { font-size: 13px; color: var(--ink-dim); }
  .item-card .desc { font-size: 22px; font-weight: 700; font-family: "Space Grotesk", sans-serif; margin: 4px 0 16px; }
  .qty-row { display: flex; align-items: center; gap: 10px; max-width: 420px; }
  .qty-row button { width: 48px; height: 48px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--surface); font-size: 20px; cursor: pointer; flex-shrink: 0; }
  .qty-row input { flex: 1; min-width: 0; text-align: center; font-size: 26px; font-weight: 700; padding: 8px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); font-family: "IBM Plex Mono", monospace; }
  .qty-row input:focus { outline: none; border-color: var(--accent); }
  .qty-row input, .qty-edit { -moz-appearance: textfield; appearance: textfield; }
  .qty-row input::-webkit-inner-spin-button, .qty-row input::-webkit-outer-spin-button,
  .qty-edit::-webkit-inner-spin-button, .qty-edit::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .item-card .actions { display: flex; gap: 10px; margin-top: 14px; }
  .item-card .meta { font-size: 12.5px; color: var(--ink-dim); margin-top: 12px; }
  .desc-input { width: 100%; max-width: 420px; margin-bottom: 12px; }

  /* ---------- stock check page ---------- */
  dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; font-size: 13.5px; }
  dl.facts dt { color: var(--ink-dim); }
  dl.facts dd { margin: 0; font-weight: 600; }
  .dropzone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 26px; text-align: center; color: var(--ink-dim); cursor: pointer; transition: border-color .15s, background .15s; }
  .dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--accent-bg); color: var(--ink); }
  .dropzone b { color: var(--ink); }
  .map-row { display: flex; gap: 14px; margin: 14px 0; flex-wrap: wrap; }
  .map-row label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--ink-dim); min-width: 200px; }
  .note { font-size: 12.5px; color: var(--ink-dim); line-height: 1.5; }
  .banner { padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.5; background: var(--warn-bg); color: var(--warn); margin-bottom: 14px; }
  .banner.err { background: var(--bad-bg); color: var(--bad); }

  /* ---------- sign-in, modals, toast ---------- */
  #authRoot { position: fixed; inset: 0; z-index: 150; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }
  .auth-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 30px 28px 26px; box-shadow: var(--shadow-lg); }
  .auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .auth-brand .glyph { width: 44px; height: 44px; border-radius: 12px; }
  .auth-brand h1 { margin: 0; font-size: 23px; font-family: "Space Grotesk", sans-serif; }
  .auth-sub { font-size: 13.5px; color: var(--ink-dim); line-height: 1.5; margin: 0 0 20px; }
  .field { display: block; margin-bottom: 13px; }
  .field > span { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-dim); margin-bottom: 5px; }
  .field input, .field select { width: 100%; padding: 11px 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--bg); color: var(--ink); }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field .help { font-size: 12px; color: var(--ink-muted); margin-top: 4px; display: block; }
  .form-error { color: var(--bad); font-size: 13px; margin: 2px 0 12px; line-height: 1.4; }
  .form-error:empty { display: none; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,17,20,.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 420px; max-height: 88vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
  .modal h3 { margin: 0 0 6px; font-family: "Space Grotesk", sans-serif; font-size: 18px; }
  .modal p { color: var(--ink-dim); font-size: 13.5px; line-height: 1.5; margin: 0 0 16px; }
  .modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 20px; border-radius: 100px; font-size: 13px; font-weight: 600; z-index: 300; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  .toast.show { opacity: 1; }

  @media (max-width: 1180px) {
    .grid.kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.two, .grid.half { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 820px) {
    .shell { grid-template-columns: 1fr; }
    aside.side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 16px; }
    nav.side-nav { flex-direction: row; overflow-x: auto; flex: 1 1 100%; order: 3; }
    nav.side-nav .nav-label { display: none; }
    .side-foot { margin: 0 0 0 auto; flex-direction: row; }
    main.content { padding: 18px 16px 50px; }
  }
</style>
</head>
<body class="signed-out">
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="glyph"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V4a1 1 0 0 1 1-1h3M3 17v3a1 1 0 0 0 1 1h3M21 7V4a1 1 0 0 0-1-1h-3M21 17v3a1 1 0 0 1-1 1h-3M7 8v8M11 8v8M14 8v8M17 8v8"/></svg></div>
      <div><b>Stock check</b><small>Dashboard</small></div>
    </div>
    <nav class="side-nav" id="nav"></nav>
    <div class="side-foot">
      <button class="me" id="meBtn" type="button"><div class="avatar" id="meAvatar">?</div><div class="who"><b id="meName">&hellip;</b><span id="meRole"></span></div></button>
      <a class="side-link" href="index.html?mobile">Open phone view</a>
    </div>
  </aside>
  <main class="content">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Overview</h1>
        <div class="sub" id="sessionLine">&hellip;</div>
      </div>
      <span class="live off" id="liveBadge">Connecting</span>
    </div>
    <div id="page"></div>
  </main>
</div>
<div id="authRoot" hidden></div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var MAX_PRODUCTS = 1000;
  var state = {
    db: null,
    user: null,
    page: "overview",
    session: null,
    products: {},
    extras: {},
    users: [],          // admins only
    activity: [],       // admins only, newest first
    loaded: { products: false, activity: false, users: false },
    currentScan: null,
    items: { search: "", filter: "all" },
    log: { search: "", who: "", action: "", range: "7" },
    importState: null
  };

  var ICONS = {

    var product = state.products[id], extra = state.extras[id];
    if (!product && !extra) {

        var snap = await state.db.doc("products/" + id).get();
        if (snap.exists) product = snap.data();
        else { var es = await state.db.doc("extras/" + id).get(); if (es.exists) extra = es.data(); }
      } catch (e) {}
    }

    root.appendChild(el("div", { class: "toolbar" }, [
      el("div", { class: "note grow", text: "Staff sign in on the phone app or here with the username and password you give them. Admins can also manage staff and start stock checks." }),
      el("button", { class: "btn btn-primary", type: "button", html: ICONS.plus + " Add staff member", onclick: addStaffModal })
    ]));
    var people = state.users.filter(function (u) { return !u.replacedBy; })
      .sort(function (a, b) { return (b.active - a.active) || String(a.name).localeCompare(String(b.name)); });
    var seen = lastSeen();
    var counts = {};
    Object.keys(state.products).forEach(function (id) { var p = state.products[id]; if (isCounted(p) && p.updatedByUid) counts[p.updatedByUid] = (counts[p.updatedByUid] || 0) + 1; });
    var card = el("div", { class: "card table-card" });
    if (!people.length) { card.appendChild(el("div", { class: "empty", text: state.loaded.users ? "No staff yet." : "Loading…" })); root.appendChild(card); return; }
    var table = el("table", { class: "data" });
    table.appendChild(el("thead", {}, [el("tr", {}, ["Name", "Username", "Role", "Status", "Counted", "Last active", ""].map(function (h, i) { return el("th", { class: i === 4 ? "r" : "", text: h }); }))]));
    var tb = el("tbody");
    people.forEach(function (u) {
      var me = u.uid === state.user.uid;
      var actions = el("div", { class: "row-actions" });
      actions.appendChild(el("button", { class: "btn btn-secondary btn-sm", type: "button", text: "Reset password", onclick: function () { resetPasswordModal(u); } }));
      if (!me) {
        actions.appendChild(el("button", { class: "btn btn-secondary btn-sm", type: "button", text: u.role === "admin" ? "Make staff" : "Make admin", onclick: function () {
          run(function () { return SC.setRole(u, u.role === "admin" ? "staff" : "admin", state.users); }, u.name + " is now " + (u.role === "admin" ? "staff" : "an admin"));
        } }));
        actions.appendChild(el("button", { class: "btn btn-sm " + (u.active ? "btn-danger" : "btn-secondary"), type: "button", text: u.active ? "Switch off" : "Switch on", onclick: function () {
          if (u.active && !window.confirm("Switch off " + u.name + "'s account? They'll be signed out on every device straight away.")) return;
          run(function () { return SC.setActive(u, !u.active); }, u.name + (u.active ? " can no longer sign in" : " can sign in again"));
        } }));
      }
      var cnt = counts[u.uid] || 0;
      // counts saved under an older account (before a password reset) belong to this person too
      state.users.forEach(function (old) { if (old.replacedBy && old.username === u.username) cnt += counts[old.uid] || 0; });
      tb.appendChild(el("tr", {}, [
        el("td", {}, [el("div", { style: "display:flex;align-items:center;gap:10px" }, [el("div", { class: "avatar", text: initials(u.name), style: "width:30px;height:30px;font-size:12px" }), el("b", { text: u.name + (me ? " (you)" : "") })])]),
        el("td", { class: "mono dim", text: "@" + u.username }),
        el("td", {}, [el("span", { class: "pill " + (u.role === "admin" ? "accent" : "idle"), text: u.role === "admin" ? "Admin" : "Staff" })]),
        el("td", {}, [el("span", { class: "pill " + (u.active ? "good" : "bad"), text: u.active ? "Active" : "Switched off" })]),
        el("td", { class: "r num", text: String(cnt) }),
        el("td", { class: "dim", text: seen[u.username] ? fmtAgo(seen[u.username]) : "Never" }),
        el("td", {}, [actions])
      ]));
    });
    table.appendChild(tb);
    card.appendChild(el("div", { class: "table-scroll" }, [table]));
    root.appendChild(card);
  }

  async function run(fn, okMsg) {
    try { await fn(); toast(okMsg); } catch (e) { toast(SC.friendlyError(e)); }
  }

  function addStaffModal() {
    formModal({
      title: "Add staff member",
      text: "Give them the username and password. They can change the password themselves after signing in.",
      fields: [
        { name: "name", label: "Full name", autocomplete: "off" },
        { name: "username", label: "Username", help: "3–30 characters: letters, numbers, dots, dashes, underscores" },
        { name: "password", label: "Password", type: "text", help: "At least 6 characters", value: suggestPassword() },
        { name: "role", label: "Role", type: "select", options: [["staff", "Staff — counts items"], ["admin", "Admin — also manages staff and stock checks"]] }
      ],
      submitLabel: "Add staff member",
      onSubmit: async function (v) {
        if (!v.name.trim()) throw new Error("Enter their name.");
        await SC.createStaff({ name: v.name, username: v.username, password: v.password, role: v.role });
        toast(v.name.trim() + " can now sign in as @" + SC.normalizeUsername(v.username));
      }
    });
  }

  function resetPasswordModal(u) {
    formModal({
      title: "Reset password for " + u.name,
      text: "Set a new password for @" + u.username + ". Their old password stops working and they're signed out everywhere.",
      fields: [{ name: "password", label: "New password", type: "text", help: "At least 6 characters", value: suggestPassword() }],
      submitLabel: "Reset password",
      onSubmit: async function (v) {
        await SC.resetPassword(u, v.password);
        toast("Password reset for @" + u.username);
      }
    });
  }

  function suggestPassword() {
    var words = ["amber", "cedar", "delta", "ember", "maple", "orbit", "pixel", "river", "solar", "tiger", "vivid", "willow"];
    var w = words[Math.floor(Math.random() * words.length)];
    return w + "-" + (1000 + Math.floor(Math.random() * 9000));
  }

  /* ---------------- stock check ---------------- */
  function renderStock(root) {
    var st = stats(), s = state.session;
    var current = el("div", { class: "card" }, [el("div", { class: "card-head" }, [el("div", {}, [el("h2", { text: "Current stock check" })])])]);
    if (!s) current.appendChild(el("div", { class: "empty", text: "No stock check running. Upload a product list to start one." }));
    else current.appendChild(el("dl", { class: "facts" }, [
      el("dt", { text: "Name" }), el("dd", { text: s.name || "" }),
      el("dt", { text: "File" }), el("dd", { text: s.sourceFileName || "" }),
      el("dt", { text: "Started" }), el("dd", { text: fmtWhen(s.startedAt) + (s.startedBy ? " by " + s.startedBy : "") }),
      el("dt", { text: "Products" }), el("dd", { text: String(st.total) }),
      el("dt", { text: "Counted" }), el("dd", { text: st.counted + " (" + st.pct + "%)" }),
      el("dt", { text: "Extra items" }), el("dd", { text: String(st.extras) })
    ]));
    current.appendChild(el("div", { class: "toolbar", style: "margin:18px 0 0" }, [
      el("button", { class: "btn btn-secondary", type: "button", html: ICONS.download + " Export results", onclick: exportResults }),
      el("button", { class: "btn btn-danger", type: "button", text: "Reset all counts", onclick: resetCounts })
    ]));

    var upload = el("div", { class: "card" }, [el("div", { class: "card-head" }, [el("div", {}, [
      el("h2", { text: "Start a new stock check" }),
      el("div", { class: "card-sub", text: "Upload an Excel or CSV file with a barcode column and a description column" })
    ])])]);
    var fileInput = el("input", { type: "file", accept: ".xlsx,.xls,.csv", hidden: "hidden" });
    fileInput.addEventListener("change", function () { if (fileInput.files[0]) readFile(fileInput.files[0]); });
    var drop = el("div", { class: "dropzone", tabindex: "0", role: "button" }, [el("b", { text: "Choose a file" }), " or drop it here"]);
    drop.addEventListener("click", function () { fileInput.click(); });
    drop.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } });
    drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", function () { drop.classList.remove("over"); });
    drop.addEventListener("drop", function (e) { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
    upload.appendChild(fileInput);
    upload.appendChild(drop);
    upload.appendChild(el("p", { class: "note", text: "Starting a new stock check replaces the current list and clears its counts — export first to keep them. Tip: format the barcode column as text in Excel to keep leading zeros." }));
    upload.appendChild(el("div", { id: "importHolder" }));
    root.appendChild(el("div", { class: "grid half" }, [current, upload]));
    if (state.importState) renderImportMap();
  }

  function readFile(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
        var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: "" })
          .filter(function (r) { return r.some(function (c) { return String(c).trim() !== ""; }); });
        if (!rows.length) { toast("That file looks empty"); return; }
        var header = rows[0];
        var barcodeCol = 0, descCol = header.length > 1 ? 1 : 0;
        header.forEach(function (h, i) { if (/barcode|bar code|code|sku|ean|upc/i.test(String(h))) barcodeCol = i; });
        header.forEach(function (h, i) { if (/desc|name|item|product|title/i.test(String(h))) descCol = i; });
        state.importState = { header: header, rows: rows.slice(1), barcodeCol: barcodeCol, descCol: descCol, fileName: file.name };
        renderImportMap();
      } catch (err) { toast("Couldn't read that file"); }
    };
    reader.readAsArrayBuffer(file);
  }

  function renderImportMap() {
    var holder = $("#importHolder");
    var im = state.importState;
    if (!holder || !im) return;
    holder.innerHTML = "";
    function colSelect(label, key) {
      var sel = el("select", { class: "input" }, im.header.map(function (h, i) { return el("option", { value: String(i), text: (h || "Column " + (i + 1)) }); }));
      sel.value = String(im[key]);
      sel.addEventListener("change", function () { im[key] = parseInt(sel.value, 10); renderImportMap(); });
      return el("label", {}, [label, sel]);
    }
    holder.appendChild(el("div", { class: "map-row" }, [colSelect("Barcode column", "barcodeCol"), colSelect("Description column", "descCol")]));
    if (im.rows.length > MAX_PRODUCTS) holder.appendChild(el("div", { class: "banner", text: "This file has " + im.rows.length + " rows. Only the first " + MAX_PRODUCTS + " will be imported." }));
    var t = el("table", { class: "data" }, [el("thead", {}, [el("tr", {}, [el("th", { text: "Barcode" }), el("th", { text: "Description" })])])]);
    var tb = el("tbody");
    im.rows.slice(0, 5).forEach(function (r) { tb.appendChild(el("tr", {}, [el("td", { class: "mono", text: r[im.barcodeCol] || "" }), el("td", { text: r[im.descCol] || "" })])); });
    t.appendChild(tb);
    holder.appendChild(el("div", { class: "card table-card", style: "box-shadow:none;margin-bottom:12px" }, [t, el("div", { class: "table-foot", text: im.fileName + " · " + im.rows.length + " rows · first 5 shown" })]));
    holder.appendChild(el("div", { class: "toolbar" }, [
      el("button", { class: "btn btn-primary", type: "button", text: "Start new stock check with this list", onclick: confirmImport }),
      el("button", { class: "btn btn-secondary", type: "button", text: "Cancel", onclick: function () { state.importState = null; holder.innerHTML = ""; } })
    ]));
  }

  async function confirmImport() {
    var im = state.importState;
    if (!im) return;
    if (!window.confirm("Start a new stock check? The current list and all its counts will be replaced.")) return;
    var seen = {};
    var rows = im.rows.slice(0, MAX_PRODUCTS).map(function (r) {
      return { barcode: String(r[im.barcodeCol] || "").trim(), description: String(r[im.descCol] || "").trim() };
    }).filter(function (r) {
      if (!r.barcode) return false;
      var id = sanitizeId(r.barcode);
      if (seen[id]) return false;
      seen[id] = true;
      return true;
    });
    if (!rows.length) { toast("No rows with a barcode found"); return; }
    toast("Importing " + rows.length + " products…");
    var failed = await withConcurrency(Object.keys(state.products), 12, function (id) { return state.db.doc("products/" + id).delete(); });
    failed += await withConcurrency(rows, 12, function (r) {
      return state.db.doc("products/" + sanitizeId(r.barcode)).set({ barcode: r.barcode, description: r.description, countedQty: null, updatedBy: null, updatedByUid: null, updatedAt: null });
    });
    try {
      await state.db.doc("meta/session").set({ name: im.fileName.replace(/\.[^.]+$/, ""), sourceFileName: im.fileName, totalProducts: rows.length, startedAt: nowIso(), startedBy: state.user.name });
    } catch (e) { failed++; }
    SC.log("import", { detail: im.fileName + " · " + rows.length + " products" });
    state.importState = null;
    toast(failed ? "Imported with " + failed + " errors — check your connection and try again" : "Stock check started with " + rows.length + " products");
    go("overview");
  }

  async function resetCounts() {
    var ids = Object.keys(state.products).filter(function (id) { return isCounted(state.products[id]); });
    if (!ids.length) { toast("Nothing to reset"); return; }
    if (!window.confirm("Clear the counted quantity on all " + ids.length + " counted items? The product list stays.")) return;
    var failed = await withConcurrency(ids, 12, function (id) {
      return state.db.doc("products/" + id).update({ countedQty: null, updatedBy: null, updatedByUid: null, updatedAt: null });
    });
    SC.log("reset_counts", { detail: ids.length + " items" });
    toast(failed ? failed + " items couldn't be reset" : "Counts reset");
  }

  /* ---------------- modals & account ---------------- */
  function closeModal() { var m = $("#modalOverlay"); if (m) m.remove(); }

  function formModal(opts) {
    closeModal();
    var overlay = el("div", { class: "modal-overlay", id: "modalOverlay" });
    var form = el("form", { class: "modal" }, [el("h3", { text: opts.title })]);
    if (opts.text) form.appendChild(el("p", { text: opts.text }));
    var inputs = {};
    (opts.fields || []).forEach(function (f) {
      var input = f.type === "select"
        ? el("select", {}, f.options.map(function (o) { return el("option", { value: o[0], text: o[1] }); }))
        : el("input", { type: f.type || "text", autocomplete: f.autocomplete || "off", required: "required", value: f.value, spellcheck: "false", autocapitalize: "none" });
      inputs[f.name] = input;
      form.appendChild(el("label", { class: "field" }, [el("span", { text: f.label }), input, f.help ? el("small", { class: "help", text: f.help }) : null]));
    });
    var errorBox = el("div", { class: "form-error", role: "alert" });
    var submit = el("button", { type: "submit", class: "btn " + (opts.danger ? "btn-danger" : "btn-primary"), text: opts.submitLabel });
    form.appendChild(errorBox);
    form.appendChild(el("div", { class: "modal-actions" }, [el("button", { type: "button", class: "btn btn-secondary", text: "Cancel", onclick: closeModal }), submit]));
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      errorBox.textContent = "";
      var values = {};
      Object.keys(inputs).forEach(function (k) { values[k] = inputs[k].value; });
      submit.disabled = true;
      try { await opts.onSubmit(values); closeModal(); }
      catch (err) { errorBox.textContent = SC.friendlyError(err); submit.disabled = false; }
    });
    overlay.addEventListener("mousedown", function (e) { if (e.target === overlay) closeModal(); });
    overlay.appendChild(form);
    $("#modalRoot").appendChild(overlay);
    var first = form.querySelector("input, select");
    if (first) first.focus();
  }

  function accountMenu() {
    closeModal();
    var overlay = el("div", { class: "modal-overlay", id: "modalOverlay" });
    function item(label, fn, cls) { return el("button", { type: "button", class: "btn btn-block " + (cls || "btn-secondary"), text: label, onclick: fn }); }
    var modal = el("div", { class: "modal" }, [
      el("h3", { text: state.user.name }),
      el("p", { text: "@" + state.user.username + " · " + (isAdmin() ? "Admin" : "Staff") }),
      el("div", { style: "display:flex;flex-direction:column;gap:8px" }, [
        item("Change password", changePassword),
        item("Sign out", async function () { closeModal(); await SC.signOut(); }),
        item("Delete my account", deleteAccount, "btn-danger"),
        item("Close", closeModal)
      ])
    ]);
    overlay.addEventListener("mousedown", function (e) { if (e.target === overlay) closeModal(); });
    overlay.appendChild(modal);
    $("#modalRoot").appendChild(overlay);
  }

  function changePassword() {
    formModal({
      title: "Change password",
      fields: [
        { name: "current", label: "Current password", type: "password", autocomplete: "current-password" },
        { name: "next", label: "New password", type: "password", autocomplete: "new-password", help: "At least 6 characters" },
        { name: "confirm", label: "Repeat new password", type: "password", autocomplete: "new-password" }
      ],
      submitLabel: "Change password",
      onSubmit: async function (v) {
        if (v.next !== v.confirm) throw new Error("The new passwords don't match.");
        await SC.changeOwnPassword(v.current, v.next);
        toast("Password changed");
      }
    });
  }

  function deleteAccount() {
    formModal({
      title: "Delete my account",
      text: "This permanently deletes your sign-in. Counts you've saved stay in the stock check. Enter your password to confirm.",
      fields: [{ name: "password", label: "Password", type: "password", autocomplete: "current-password" }],
      submitLabel: "Delete account",
      danger: true,
      onSubmit: async function (v) {
        var admins = isAdmin() ? state.users.filter(function (u) { return u.role === "admin" && u.active && !u.replacedBy; }).length : undefined;
        await SC.deleteOwnAccount(v.password, admins);
      }
    });
  }

  /* ---------------- boot ---------------- */
  $("#meBtn").addEventListener("click", function () { if (state.user) accountMenu(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });
  var hashPage = (location.hash || "").slice(1);
  if (PAGES.some(function (p) { return p.id === hashPage; })) state.page = hashPage;

  (async function boot() {
    var fb = null;
    try { fb = await SC.init(); } catch (e) { console.warn(e); }
    if (!fb) {
      document.body.classList.remove("signed-out");
      $("#page").appendChild(el("div", { class: "banner err", text: "Can't reach the database. Check the Firebase config in common.js." }));
      return;
    }
    state.db = fb.db;
    var authHeard = false;
    SC.onAuth(function (profile, error) { authHeard = true; onAuthChanged(profile, error); });
    // If the sign-in service is slow to answer, show the sign-in screen anyway
    setTimeout(function () { if (!authHeard && !state.user) showAuthScreen(""); }, 4000);
  })();
})();
</script>
</body>
</html>
