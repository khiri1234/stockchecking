# Builds the Windows installer (The-H-Stock-Management-Setup-x.y.z.exe).
# Download it from the run's "Artifacts" section on the Actions tab.
name: Windows desktop app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - desktop/**
      - dashboard.html
      - index.html
      - common.js
      - scripts/build.js
      - package.json
      - package-lock.json
      - .github/workflows/windows-desktop.yml
  push:
    branches: [main]
    paths:
      - desktop/**
      - dashboard.html
      - index.html
      - common.js
      - scripts/build.js
      - package.json
      - package-lock.json
      - .github/workflows/windows-desktop.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # The installer isn't code-signed yet
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web libraries
        run: npm ci

      - name: Install Electron
        working-directory: desktop
        run: npm ci

      - name: Build installer
        working-directory: desktop
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: The-H-Stock-Management-Windows
          path: desktop/dist/*.exe
          retention-days: 90
