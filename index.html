<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>The H Stock Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="common.js"></script>
<style>
  :root {
    --bg: #EDEFF2;
    --surface: #FFFFFF;
    --surface-2: #E2E5EA;
    --ink: #14171C;
    --ink-dim: #676D78;
    --border: #D4D8DE;
    --accent: #E1550C;
    --accent-2: #C4470A;
    --accent-ink: #FFFFFF;
    --good: #0F8F72;
    --good-bg: #DCEFE9;
    --bad: #C4392E;
    --bad-bg: #FAE5E2;
    --radius-lg: 22px;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(15,17,20,0.05), 0 10px 28px -14px rgba(15,17,20,0.22);
    --shadow-lg: 0 2px 4px rgba(15,17,20,0.06), 0 20px 44px -18px rgba(15,17,20,0.3);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0C0D10;
      --surface: #17191D;
      --surface-2: #202226;
      --ink: #EFEEEA;
      --ink-dim: #8D9199;
      --border: #2B2D32;
      --accent: #FF7A2B;
      --accent-2: #FF9552;
      --accent-ink: #1A0D02;
      --good: #38C99E;
      --good-bg: #123329;
      --bad: #FF6E60;
      --bad-bg: #34201C;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 28px -14px rgba(0,0,0,0.6);
      --shadow-lg: 0 2px 4px rgba(0,0,0,0.4), 0 20px 44px -18px rgba(0,0,0,0.7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0C0D10;
    --surface: #17191D;
    --surface-2: #202226;
    --ink: #EFEEEA;
    --ink-dim: #8D9199;
    --border: #2B2D32;
    --accent: #FF7A2B;
    --accent-2: #FF9552;
    --accent-ink: #1A0D02;
    --good: #38C99E;
    --good-bg: #123329;
    --bad: #FF6E60;
    --bad-bg: #34201C;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 28px -14px rgba(0,0,0,0.6);
    --shadow-lg: 0 2px 4px rgba(0,0,0,0.4), 0 20px 44px -18px rgba(0,0,0,0.7);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* App-style layout: the page itself never scrolls, only <main> does, so the
     header stays put, including when the keyboard opens */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .display { font-family: "Space Grotesk", "Inter", sans-serif; }
  button, select, input { font-family: inherit; }
  /* iPhone zooms the page into any text box under 16px when it is tapped */
  :where(input:not([type=file]):not([type=checkbox]):not([type=radio]), select, textarea) { font-size: 16px; }
  svg.icon { width: 18px; height: 18px; flex-shrink: 0; }
  #app { max-width: 720px; height: 100%; margin: 0 auto; padding: 0 14px; display: flex; flex-direction: column; }

  /* Fixed at the top of the screen, covering the status bar area */
  header.top {
    flex-shrink: 0; position: relative;
    z-index: 30; background: var(--bg);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 14px 10px; margin: 0 -14px;
  }
  .brand { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .brand-mark { display: flex; align-items: center; gap: 9px; }
  .brand-mark .glyph {
    width: 34px; height: 34px; border-radius: 9px; background: var(--ink); color: var(--bg);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; margin: 0; font-family: "Space Grotesk", sans-serif; }
  .brand .session-name { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
  .staff-chip {
    font-size: 12px; color: var(--ink-dim); background: var(--surface);
    border: 1px solid var(--border); border-radius: 100px; padding: 6px 12px 6px 8px;
    display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow);
  }
  .staff-chip svg { color: var(--accent); }
  .staff-chip b { color: var(--ink); font-weight: 600; }

  .progress-wrap { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .progress-track {
    flex: 1; height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; position: relative;
    background-image: repeating-linear-gradient(90deg, var(--border) 0 1px, transparent 1px 10%);
  }
  .progress-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width .4s cubic-bezier(.4,0,.2,1); }
  .progress-pct { font-size: 16px; font-weight: 700; white-space: nowrap; min-width: 3.2em; text-align: right; }
  .progress-label { font-size: 11.5px; color: var(--ink-dim); margin-top: 5px; }

  nav.tabs { display: flex; gap: 4px; margin-top: 14px; background: var(--surface-2); border-radius: 11px; padding: 3px; }
  nav.tabs button {
    flex: 1; padding: 8px 4px; border-radius: 8px; border: none;
    background: transparent; color: var(--ink-dim); font-size: 12.5px; font-weight: 600; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav.tabs button svg { width: 17px; height: 17px; }
  nav.tabs button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  nav.tabs button.active svg { color: var(--accent); }

  main {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    margin: 0 -14px; padding: 16px 14px calc(110px + env(safe-area-inset-bottom, 0px));
  }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .panel h2 { font-size: 13.5px; margin: 0 0 3px; font-weight: 700; font-family: "Space Grotesk", sans-serif; }
  .panel .hint { font-size: 12.5px; color: var(--ink-dim); margin: 0 0 12px; line-height: 1.5; }

  .scan-hero {
    position: relative; overflow: hidden; border-radius: var(--radius-lg);
    background: var(--ink); color: #fff; padding: 20px 18px 22px; margin-bottom: 14px; box-shadow: var(--shadow-lg);
  }
  .scan-hero::before {
    content: ""; position: absolute; inset: 0; opacity: .5;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.09) 0 3px, transparent 3px 7px, rgba(255,255,255,.05) 7px 8px, transparent 8px 14px);
  }
  .scan-hero .laser {
    position: absolute; left: 0; right: 0; height: 2px; top: 0;
    background: linear-gradient(90deg, transparent, var(--accent-2) 20%, #fff 50%, var(--accent-2) 80%, transparent);
    box-shadow: 0 0 12px 2px var(--accent); opacity: .85;
    animation: laserSweep 2.6s ease-in-out infinite;
  }
  @keyframes laserSweep { 0% { top: 6%; } 50% { top: 92%; } 100% { top: 6%; } }
  @media (prefers-reduced-motion: reduce) { .scan-hero .laser { animation: none; top: 50%; } }
  .scan-hero h2 { position: relative; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.75); margin: 0 0 2px; text-transform: none; }
  .scan-hero p.hint { position: relative; font-size: 12px; color: rgba(255,255,255,.55); margin: 0 0 14px; }
  .scan-form { position: relative; display: flex; gap: 8px; }
  .scan-form input {
    flex: 1; min-width: 0; padding: 15px 16px; font-size: 17px; border-radius: var(--radius-sm);
    border: 1.5px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); color: #fff;
    font-family: "IBM Plex Mono", monospace; letter-spacing: .02em;
  }
  .scan-form input::placeholder { color: rgba(255,255,255,.4); font-family: "Inter", sans-serif; letter-spacing: normal; }
  .scan-form input:focus { outline: none; border-color: var(--accent); background: rgba(255,255,255,.12); }
  .icon-btn {
    width: 50px; flex-shrink: 0; border-radius: var(--radius-sm); border: 1.5px solid rgba(255,255,255,.18);
    background: var(--accent); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 var(--accent-2); transition: transform .08s ease, box-shadow .08s ease;
  }
  .icon-btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--accent-2); }
  .icon-btn.go { background: #fff; color: var(--accent-2); box-shadow: 0 3px 0 rgba(255,255,255,.35); }
  .icon-btn.go:active { box-shadow: 0 0 0 rgba(255,255,255,.35); }
  .icon-btn[hidden] { display: none; }

  .btn {
    padding: 12px 16px; border-radius: var(--radius-sm); border: 1.5px solid transparent; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 var(--accent-2); }
  .btn-primary:active { transform: translateY(3px); box-shadow: 0 0 0 var(--accent-2); }
  .btn-primary:disabled { opacity: .5; cursor: default; box-shadow: none; transform: none; }
  .btn-secondary { background: var(--surface-2); color: var(--ink); border-color: var(--border); }
  .btn-secondary:active { transform: translateY(1px); }
  .btn-danger { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
  .btn-block { width: 100%; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-row .btn { flex: 1; min-width: 140px; }

  .scanned-card { position: relative; margin-top: 14px; padding: 14px 14px 14px 18px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
  .scanned-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--ink-dim); }
  .scanned-card.found::before { background: var(--good); }
  .scanned-card.unknown::before { background: var(--accent); }
  .scanned-card.extra::before { background: var(--accent); }
  .sc-top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .scanned-card .sc-barcode { font-size: 12px; color: var(--ink-dim); }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 100px; text-transform: uppercase; letter-spacing: .04em; }
  .badge-extra { background: var(--accent); color: var(--accent-ink); }
  .scanned-card .sc-desc { font-size: 17px; font-weight: 700; margin: 4px 0 14px; line-height: 1.3; font-family: "Space Grotesk", sans-serif; }
  .qty-row { display: flex; align-items: center; gap: 10px; }
  .qty-row button { width: 46px; height: 46px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); font-size: 20px; cursor: pointer; }
  .qty-row button:active { background: var(--surface-2); }
  .qty-row input { flex: 1; min-width: 0; text-align: center; font-size: 24px; font-weight: 700; padding: 10px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); font-family: "IBM Plex Mono", monospace; }
  .qty-row input:focus { outline: none; border-color: var(--accent); }
  .save-row { display: flex; gap: 8px; margin-top: 12px; }
  .unknown-msg { font-size: 13px; color: var(--ink-dim); margin-bottom: 10px; }
  .extra-desc-input { width: 100%; padding: 11px 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); font-size: 16px; margin-bottom: 10px; }
  .last-counted { font-size: 12px; color: var(--ink-dim); margin-top: 10px; }

  .filter-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .filter-row button { flex: 1; padding: 8px 4px; font-size: 12.5px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-dim); cursor: pointer; font-weight: 600; }
  .filter-row button.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .search-input { width: 100%; padding: 11px 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--bg); color: var(--ink); font-size: 16px; margin-bottom: 10px; }
  .search-input:focus { outline: none; border-color: var(--accent); }

  .item-row { display: flex; align-items: center; gap: 11px; padding: 11px 8px 11px 10px; border-left: 3px solid var(--border); border-bottom: 1px solid var(--border); cursor: pointer; margin-bottom: 2px; }
  .item-row:last-child { border-bottom: none; margin-bottom: 0; }
  .item-row.counted { border-left-color: var(--good); }
  .item-row .info { flex: 1; min-width: 0; }
  .item-row .desc { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-row .code { font-size: 11px; color: var(--ink-dim); }
  .item-row .status-pill { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 100px; white-space: nowrap; }
  .item-row.counted .status-pill { background: var(--good-bg); color: var(--good); }
  .item-row:not(.counted) .status-pill { background: var(--surface-2); color: var(--ink-dim); }
  .item-row .qty { font-size: 15px; font-weight: 700; font-family: "IBM Plex Mono", monospace; min-width: 26px; text-align: right; }
  .item-row .qty.dash { color: var(--ink-dim); font-weight: 400; }
  .empty-note { text-align: center; padding: 34px 10px; color: var(--ink-dim); font-size: 13.5px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-dim); margin-bottom: 5px; }
  .field select, .field input[type=text] { width: 100%; padding: 10px 10px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--bg); color: var(--ink); font-size: 16px; }

  table.preview { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.preview th, table.preview td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.preview th { color: var(--ink-dim); font-weight: 600; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 12px; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 14px; border-left: 3px solid var(--accent); }
  .stat .n { font-size: 22px; font-weight: 700; font-family: "Space Grotesk", sans-serif; }
  .stat .l { font-size: 11px; color: var(--ink-dim); }

  .toast {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 11px 20px; border-radius: 100px; font-size: 13px;
    font-weight: 600; z-index: 100; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
    max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--surface); border-radius: 18px; padding: 18px; max-width: 380px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
  .modal h3 { margin: 0 0 8px; font-size: 15px; font-family: "Space Grotesk", sans-serif; }
  .modal p { font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
  .cam-wrap { position: relative; border-radius: var(--radius); overflow: hidden; background: #000; aspect-ratio: 1; margin-bottom: 12px; }
  .cam-wrap video { width: 100%; height: 100%; object-fit: cover; }
  .cam-wrap .corner { position: absolute; width: 26px; height: 26px; border: 3px solid var(--accent); }
  .cam-wrap .corner.tl { top: 16%; left: 16%; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
  .cam-wrap .corner.tr { top: 16%; right: 16%; border-left: none; border-bottom: none; border-radius: 0 6px 0 0; }
  .cam-wrap .corner.bl { bottom: 16%; left: 16%; border-right: none; border-top: none; border-radius: 0 0 0 6px; }
  .cam-wrap .corner.br { bottom: 16%; right: 16%; border-left: none; border-top: none; border-radius: 0 0 6px 0; }

  .banner { padding: 11px 12px; border-radius: var(--radius-sm); font-size: 12.5px; margin-bottom: 12px; line-height: 1.5; border-left: 3px solid var(--accent); background: var(--surface-2); }
  .banner.warn { background: var(--surface-2); color: var(--ink); }
  .scanned-card.recount { border-left-color: #D69E2E; }
  .banner.recount { cursor: pointer; font-weight: 600; }
  .banner.err { background: var(--bad-bg); color: var(--bad); border-left-color: var(--bad); }

  /* Sign-in screen */
  #authRoot { position: fixed; inset: 0; z-index: 150; background: var(--bg); overflow-y: auto;
    display: flex; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  #authRoot[hidden] { display: none; }
  body.signed-out #app { visibility: hidden; }
  .auth-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 26px 22px 22px; box-shadow: var(--shadow-lg); }
  .auth-brand { display: flex; align-items: center; gap: 11px; margin-bottom: 8px; }
  .auth-brand .glyph { width: 42px; height: 42px; border-radius: 11px; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; }
  .auth-brand h1 { margin: 0; font-size: 22px; font-family: "Space Grotesk", sans-serif; }
  .auth-sub { font-size: 13px; color: var(--ink-dim); line-height: 1.5; margin: 0 0 18px; }
  .auth-field { display: block; margin-bottom: 12px; }
  .auth-field span { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-dim); margin-bottom: 5px; }
  .auth-field input { width: 100%; padding: 12px; font-size: 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--bg); color: var(--ink); }
  .auth-field input:focus { outline: none; border-color: var(--accent); }
  .auth-error { color: var(--bad); font-size: 13px; min-height: 18px; margin: 2px 0 10px; line-height: 1.4; }
  .auth-error:empty { min-height: 0; margin: 0 0 6px; }
  .menu-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="brand-mark">
        <div class="glyph">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V4a1 1 0 0 1 1-1h3M3 17v3a1 1 0 0 0 1 1h3M21 7V4a1 1 0 0 0-1-1h-3M21 17v3a1 1 0 0 1-1 1h-3M7 8v8M11 8v8M14 8v8M17 8v8"/></svg>
        </div>
        <div>
          <h1>Stock check</h1>
          <div class="session-name" id="sessionName">Loading&hellip;</div>
        </div>
      </div>
      <div class="staff-chip" id="staffChip" title="Your account">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <b id="staffNameLabel">&hellip;</b>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-pct display" id="progressPct">0%</div>
    </div>
    <div class="progress-label" id="progressLabel">0 of 0 counted</div>
    <nav class="tabs">
      <button data-tab="scan" class="active">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V4a1 1 0 0 1 1-1h3M3 17v3a1 1 0 0 0 1 1h3M21 7V4a1 1 0 0 0-1-1h-3M21 17v3a1 1 0 0 1-1 1h-3M7 8v8M11 8v8M14 8v8M17 8v8"/></svg>
        Scan
      </button>
      <button data-tab="list">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        Item list
      </button>
      <button data-tab="manage">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h4M12 6h8M4 12h11M19 12h1M4 18h6M14 18h6"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="12" cy="18" r="2"/></svg>
        Manage
      </button>
    </nav>
  </header>

  <main>
    <section id="tab-scan"></section>
    <section id="tab-list" style="display:none"></section>
    <section id="tab-manage" style="display:none"></section>
  </main>
</div>

<div id="authRoot" hidden></div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------
   * State
   * ------------------------------------------------------------- */
  var state = {
    dbApi: null,
    downloadsApi: null,
    user: null,             // signed-in profile { uid, username, name, role }
    staffName: "",
    session: null,          // meta/session doc data
    catalog: null,          // { listId, items: id -> { barcode, description }, order: [id] }
    catalogLoading: false,
    catalogError: "",
    counted: 0,             // running total from meta/stats
    recent: [],             // latest counts, newest first
    recounts: {},           // id -> recounts/{id} (see common.js)
    extras: {},             // id -> extra item data
    activeTab: "scan",
    currentScan: null,      // { id, barcode, existing product|extra or null }
    listFilter: "all",      // all | recent
    listSearch: "",
  };


  /* ---------------------------------------------------------------
   * Small utilities
   * ------------------------------------------------------------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") e.textContent = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // Same barcode -> document ID mapping everywhere (see common.js)
  function sanitizeId(raw) { return SC.sanitizeId(raw); }
  function nowIso() { return new Date().toISOString(); }
  function fmtWhen(iso) {
    if (!iso) return "";
    try {
      var d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " +
        d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    } catch (e) { return ""; }
  }
  var toastTimer = null;
  function toast(msg) {
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------------------------------------------------------------
   * Platform helpers
   * ------------------------------------------------------------- */
  // Capacitor plugin when running inside the iOS app, else null
  function nativePlugin(name) {
    var C = window.Capacitor;
    if (!C || !C.isNativePlatform || !C.isNativePlatform()) return null;
    if (C.isPluginAvailable && !C.isPluginAvailable(name)) return null;
    return C.registerPlugin ? C.registerPlugin(name) : (C.Plugins && C.Plugins[name]) || null;
  }

  // iOS app: write the file to the cache folder and open the share sheet
  var nativeDownloads = {
    save: async function (opts) {
      var Filesystem = nativePlugin("Filesystem");
      var Share = nativePlugin("Share");
      var base64 = await new Promise(function (resolve, reject) {
        var r = new FileReader();
        r.onload = function () { resolve(String(r.result).split(",")[1]); };
        r.onerror = function () { reject(r.error); };
        r.readAsDataURL(opts.data);
      });
      var written = await Filesystem.writeFile({ path: opts.filename, data: base64, directory: "CACHE" });
      try {
        await Share.share({ title: opts.filename, url: written.uri });
      } catch (e) {
        // Closing the share sheet without choosing an app isn't an error
        if (/cancel/i.test(String((e && e.message) || ""))) return;
        throw e;
      }
    }
  };

  // Same shape as the claude.ai downloads capability, using a plain <a download>
  var browserDownloads = {
    save: async function (opts) {
      var url = URL.createObjectURL(opts.data);
      var a = el("a", { href: url, download: opts.filename });
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }
  };

  async function initCapabilities() {
    state.downloadsApi = nativePlugin("Filesystem") && nativePlugin("Share") ? nativeDownloads : browserDownloads;
    try {
      var fb = await SC.init();
      if (fb) state.dbApi = fb.db;
    } catch (e) { console.warn("firebase init failed", e); }

    if (!state.dbApi) {
      $("#sessionName").textContent = "Live sync unavailable in this view";
      var b = el("div", { class: "banner err" }, [
        document.createTextNode("This view can't reach the shared database, so counts won't sync between devices. Check the Firebase config in common.js.")
      ]);
      $("#app").insertBefore(b, $("main"));
    }
  }

  /* ---------------------------------------------------------------
   * Sign-in
   * ------------------------------------------------------------- */
  function renderStaffChip() {
    $("#staffNameLabel").textContent = state.user ? state.user.name : "Sign in";
  }

  function isAdmin() { return !!(state.user && state.user.role === "admin"); }

  // Only admins start new stock checks, reset counts and export
  function applyRole() {
    var manageBtn = $('nav.tabs button[data-tab="manage"]');
    manageBtn.style.display = isAdmin() ? "" : "none";
    if (!isAdmin() && state.activeTab === "manage") switchTab("scan");
  }

  function onAuthChanged(profile, error) {
    if (profile) {
      var firstSignIn = !state.user;
      state.user = profile;
      state.staffName = profile.name;
      hideAuthScreen();
      renderStaffChip();
      applyRole();
      startSync();
      if (firstSignIn) switchTab(state.activeTab);
    } else {
      state.user = null;
      state.staffName = "";
      stopSync();
      closeModal();
      renderStaffChip();
      showAuthScreen(error ? SC.friendlyError(error) : "");
    }
  }

  async function showAuthScreen(message) {
    var mode = "login";
    // Don't leave people waiting if the server is slow: assume sign-in
    try { if (!(await SC.withTimeout(SC.isSetupDone(), 5000))) mode = "setup"; } catch (e) {}
    if (state.user) return; // signed in while checking
    var root = $("#authRoot");
    // Already showing: keep what's typed, just update the message
    if (!root.hidden && root.dataset.mode === mode && root.firstChild) {
      if (message) root.querySelector(".auth-error").textContent = message;
      return;
    }
    root.dataset.mode = mode;
    root.innerHTML = "";
    root.hidden = false;
    document.body.classList.add("signed-out");

    var card = el("div", { class: "auth-card" });
    card.appendChild(el("div", { class: "auth-brand" }, [
      el("div", { class: "glyph", html: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V4a1 1 0 0 1 1-1h3M3 17v3a1 1 0 0 0 1 1h3M21 7V4a1 1 0 0 0-1-1h-3M21 17v3a1 1 0 0 1-1 1h-3M7 8v8M11 8v8M14 8v8M17 8v8"/></svg>' }),
      el("h1", { text: "The H Stock Management" })
    ]));
    card.appendChild(el("p", { class: "auth-sub", text: mode === "setup"
      ? "First-time setup: create the admin account. You'll add staff accounts after this."
      : "Sign in with the username and password your manager gave you." }));

    var form = el("form", { class: "auth-form", autocomplete: "on" });
    var fields = mode === "setup"
      ? [["name", "Your name", "text", "name"], ["username", "Username", "text", "username"], ["password", "Password (6+ characters)", "password", "new-password"], ["confirm", "Repeat password", "password", "new-password"]]
      : [["username", "Username", "text", "username"], ["password", "Password", "password", "current-password"]];
    var inputs = {};
    fields.forEach(function (f, i) {
      var input = el("input", { type: f[2], name: f[0], autocomplete: f[3], autocapitalize: "none", autocorrect: "off", spellcheck: "false", required: "required",
        enterkeyhint: i === fields.length - 1 ? "go" : "next" });
      inputs[f[0]] = input;
      form.appendChild(el("label", { class: "auth-field" }, [el("span", { text: f[1] }), input]));
    });
    var errorBox = el("div", { class: "auth-error", role: "alert", text: message || "" });
    form.appendChild(errorBox);
    var submit = el("button", { type: "submit", class: "btn btn-primary btn-block", text: mode === "setup" ? "Create admin account" : "Sign in" });
    form.appendChild(submit);
    // Enter / Next moves to the next empty box, and signs in from the last one
    form.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
      e.preventDefault();
      var boxes = Array.prototype.slice.call(form.querySelectorAll("input"));
      var next = boxes.slice(boxes.indexOf(e.target) + 1).filter(function (b) { return !b.value; })[0]
        || boxes.filter(function (b) { return !b.value; })[0];
      if (next) next.focus();
      else if (!submit.disabled) form.requestSubmit(submit);
    });
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      errorBox.textContent = "";
      if (mode === "setup") {
        if (!inputs.name.value.trim()) { errorBox.textContent = "Enter your name."; return; }
        if (inputs.password.value !== inputs.confirm.value) { errorBox.textContent = "The passwords don't match."; return; }
      }
      submit.disabled = true;
      submit.textContent = mode === "setup" ? "Creating…" : "Signing in…";
      try {
        if (mode === "setup") await SC.setupFirstAdmin(inputs.name.value, inputs.username.value, inputs.password.value);
        else await SC.signIn(inputs.username.value, inputs.password.value);
      } catch (err) {
        errorBox.textContent = SC.friendlyError(err);
        submit.disabled = false;
        submit.textContent = mode === "setup" ? "Create admin account" : "Sign in";
      }
    });
    card.appendChild(form);
    root.appendChild(card);
    // Focus straight away: a delayed focus could jump mid-typing
    var firstInput = form.querySelector("input");
    if (firstInput && !SC.isNative()) firstInput.focus();
  }

  function hideAuthScreen() {
    var root = $("#authRoot");
    root.hidden = true;
    root.innerHTML = "";
    document.body.classList.remove("signed-out");
  }

  /* ---------------------------------------------------------------
   * Account menu
   * ------------------------------------------------------------- */
  function closeModal() { var m = $("#accountOverlay"); if (m) m.remove(); }

  // Modal with inputs; onSubmit(values) returns a promise, errors show inline
  function formModal(opts) {
    closeModal();
    var overlay = el("div", { class: "modal-overlay", id: "accountOverlay" });
    var modal = el("form", { class: "modal" });
    modal.appendChild(el("h3", { text: opts.title }));
    if (opts.text) modal.appendChild(el("p", { text: opts.text }));
    var inputs = {};
    (opts.fields || []).forEach(function (f) {
      var input = el("input", { type: f.type || "text", autocomplete: f.autocomplete || "off", required: "required" });
      inputs[f.name] = input;
      modal.appendChild(el("label", { class: "auth-field" }, [el("span", { text: f.label }), input]));
    });
    var errorBox = el("div", { class: "auth-error", role: "alert" });
    modal.appendChild(errorBox);
    var submit = el("button", { type: "submit", class: "btn btn-block " + (opts.danger ? "btn-danger" : "btn-primary"), text: opts.submitLabel });
    var cancel = el("button", { type: "button", class: "btn btn-secondary btn-block", text: "Cancel", style: "margin-top:8px" });
    cancel.addEventListener("click", closeModal);
    modal.appendChild(submit);
    modal.appendChild(cancel);
    modal.addEventListener("submit", async function (e) {
      e.preventDefault();
      errorBox.textContent = "";
      var values = {};
      Object.keys(inputs).forEach(function (k) { values[k] = inputs[k].value; });
      submit.disabled = true;
      try { await opts.onSubmit(values); closeModal(); }
      catch (err) { errorBox.textContent = SC.friendlyError(err); submit.disabled = false; }
    });
    overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
    overlay.appendChild(modal);
    $("#modalRoot").appendChild(overlay);
    var first = modal.querySelector("input");
    if (first) first.focus();
  }

  function openAccountMenu() {
    if (!state.user) return;
    closeModal();
    var overlay = el("div", { class: "modal-overlay", id: "accountOverlay" });
    var modal = el("div", { class: "modal" });
    modal.appendChild(el("h3", { text: state.user.name }));
    modal.appendChild(el("p", { text: "@" + state.user.username + " · " + (isAdmin() ? "Admin" : "Staff") }));
    var list = el("div", { class: "menu-list" });
    function item(label, fn, cls) {
      var b = el("button", { type: "button", class: "btn btn-block " + (cls || "btn-secondary"), text: label });
      b.addEventListener("click", fn);
      list.appendChild(b);
    }
    if (!SC.isNative()) item("Open desktop dashboard", function () { location.href = "dashboard.html"; });
    item("Change password", changePassword);
    item("Sign out", async function () { closeModal(); await SC.signOut(); });
    item("Delete my account", deleteAccount, "btn-danger");
    item("Close", closeModal);
    modal.appendChild(list);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
    overlay.appendChild(modal);
    $("#modalRoot").appendChild(overlay);
  }

  function changePassword() {
    formModal({
      title: "Change password",
      fields: [
        { name: "current", label: "Current password", type: "password", autocomplete: "current-password" },
        { name: "next", label: "New password (6+ characters)", type: "password", autocomplete: "new-password" },
        { name: "confirm", label: "Repeat new password", type: "password", autocomplete: "new-password" }
      ],
      submitLabel: "Change password",
      onSubmit: async function (v) {
        if (v.next !== v.confirm) throw new Error("The new passwords don't match.");
        await SC.changeOwnPassword(v.current, v.next);
        toast("Password changed");
      }
    });
  }

  function deleteAccount() {
    formModal({
      title: "Delete my account",
      text: "This permanently deletes your sign-in. Counts you've already saved stay in the stock check. Enter your password to confirm.",
      fields: [{ name: "password", label: "Password", type: "password", autocomplete: "current-password" }],
      submitLabel: "Delete account",
      danger: true,
      onSubmit: async function (v) {
        var admins;
        if (isAdmin()) {
          var snap = await state.dbApi.collection("users").where("role", "==", "admin").get();
          admins = snap.docs.filter(function (d) { var u = d.data(); return u.active && !u.replacedBy; }).length;
        }
        await SC.deleteOwnAccount(v.password, admins);
        toast("Account deleted");
      }
    });
  }

  /* ---------------------------------------------------------------
   * DB subscriptions (only while signed in)
   * The product list loads once (a few large documents), barcodes are looked
   * up locally, and progress comes from meta/stats, so this stays fast with
   * 50,000+ items.
   * ------------------------------------------------------------- */
  var unsubs = [];
  function startSync() {
    if (unsubs.length || !state.dbApi) return;
    unsubs = [subscribeSession(), subscribeStats(), subscribeRecent(), subscribeExtras(), subscribeRecounts()];
  }
  function stopSync() {
    unsubs.forEach(function (u) { if (u) u(); });
    unsubs = [];
    state.session = null;
    state.catalog = null;
    state.catalogError = "";
    state.counted = 0;
    state.recent = [];
    state.recounts = {};
    state.extras = {};
    state.currentScan = null;
  }

  function subscribeSession() {
    // Loads the list only once the server has confirmed the stock check: reading
    // it while this device's own new stock check is still being saved can leave
    // the stock check looking deleted until the app is reopened.
    return SC.listen(state.dbApi.doc("meta/session"), function (snap) {
      state.session = snap.exists ? snap.data() : null;
      if (!snap.metadata.hasPendingWrites) loadCatalog();
      renderHeader();
      renderManageStatus();
    }, function (err) {
      console.warn("session snapshot error", err);
    }, { includeMetadataChanges: true });
  }

  function loadCatalog() {
    var s = state.session;
    // A stock check saved by the previous version: an admin's app converts it once
    if (s && !s.listId && isAdmin() && !loadCatalog.migrating) {
      loadCatalog.migrating = true;
      SC.migrateLegacyList(s).catch(function (e) { console.warn("list conversion failed", e); })
        .then(function () { loadCatalog.migrating = false; });
    }
    if (!s || !s.listId) { state.catalog = null; state.catalogError = ""; refreshLists(); return; }
    if (state.catalog && state.catalog.listId === s.listId) return;
    state.catalogLoading = true;
    renderHeader();
    SC.loadCatalog(s).then(function (cat) {
      if (!state.session || state.session.listId !== s.listId) return;
      state.catalog = { listId: s.listId, items: cat.items, order: cat.order };
      state.catalogError = "";
    }).catch(function (e) {
      state.catalogError = SC.friendlyError(e);
    }).then(function () {
      state.catalogLoading = false;
      renderHeader();
      refreshLists();
    });
  }

  function subscribeStats() {
    return SC.listen(state.dbApi.doc("meta/stats"), function (snap) {
      state.counted = snap.exists ? (snap.data().counted || 0) : 0;
      renderHeader();
      renderManageStatus();
    }, function (err) { console.warn("stats snapshot error", err); });
  }

  // The latest counts, for the "Recently counted" list
  function subscribeRecent() {
    return SC.listen(state.dbApi.collection("counts").orderBy("at", "desc").limit(100), function (snap) {
      state.recent = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      if (state.activeTab === "list") renderListRows();
    }, function (err) { console.warn("recent counts snapshot error", err); });
  }

  function subscribeRecounts() {
    return SC.listen(state.dbApi.collection("recounts"), function (snap) {
      var map = {};
      snap.docs.forEach(function (d) { map[d.id] = d.data(); });
      state.recounts = map;
      renderRecountBanner();
      if (state.activeTab === "list") renderListTab();
    }, function (err) { console.warn("recounts snapshot error", err); });
  }

  // Open recounts this person may do (not their own first count)
  function recountsForMe() {
    return Object.keys(state.recounts).map(function (id) { return Object.assign({ id: id }, state.recounts[id]); })
      .filter(function (r) { return r.status === "open" && state.user && r.firstByUid !== state.user.uid; });
  }
  // A blind recount is waiting: keep the first number out of sight
  function hideQty(id) {
    var r = state.recounts[id];
    return !!(r && r.status === "open" && state.user && r.firstByUid !== state.user.uid && !isAdmin());
  }
  function renderRecountBanner() {
    var holder = $("#recountBanner");
    if (!holder) return;
    holder.innerHTML = "";
    var n = recountsForMe().length;
    if (!n) return;
    var b = el("div", { class: "banner recount", role: "button", text: SC.plural(n, "item") + " to recount \u2014 tap to see " + (n === 1 ? "it" : "them") });
    b.addEventListener("click", function () { state.listFilter = "recount"; switchTab("list"); });
    holder.appendChild(b);
  }

  function subscribeExtras() {
    return SC.listen(state.dbApi.collection("extras").limit(500), function (snap) {
      var map = {};
      snap.docs.forEach(function (d) { map[d.id] = d.data(); });
      state.extras = map;
      if (state.activeTab === "list") renderListRows();
    }, function (err) {
      console.warn("extras snapshot error", err);
    });
  }

  function refreshLists() {
    if (state.activeTab === "list") renderListTab();
    if (state.activeTab === "manage") renderManageStatus();
  }

  /* ---------------------------------------------------------------
   * Header / progress
   * ------------------------------------------------------------- */
  function renderHeader() {
    var s = state.session;
    if (!s) {
      $("#sessionName").textContent = state.dbApi ? (isAdmin() ? "No product list yet — go to Manage to upload one" : "No stock check running yet") : $("#sessionName").textContent;
    } else if (s && !s.listId) {
      $("#sessionName").textContent = "This list was saved in an older format — an admin needs to upload it again";
    } else {
      $("#sessionName").textContent = (s.name || "Stock check") + (s.startedAt ? " — started " + fmtWhen(s.startedAt) : "") +
        (state.catalogLoading ? " · loading list…" : "") + (state.catalogError ? " · " + state.catalogError : "");
    }
    var total = s && s.listId ? (s.totalProducts || 0) : 0;
    var counted = Math.min(state.counted, total);
    var pct = total ? Math.floor((counted / total) * 100) : 0;
    $("#progressFill").style.width = pct + "%";
    $("#progressPct").textContent = pct + "%";
    $("#progressLabel").textContent = counted.toLocaleString() + " of " + total.toLocaleString() + " counted";
  }

  /* ---------------------------------------------------------------
   * Tabs
   * ------------------------------------------------------------- */
  function switchTab(tab) {
    state.activeTab = tab;
    $all("nav.tabs button").forEach(function (b) { b.classList.toggle("active", b.dataset.tab === tab); });
    $all("main > section").forEach(function (s) { s.style.display = "none"; });
    $("#tab-" + tab).style.display = "block";
    if (tab === "scan") renderScanTab();
    if (tab === "list") renderListTab();
    if (tab === "manage") renderManageTab();
  }

  /* ---------------------------------------------------------------
   * SCAN TAB
   * ------------------------------------------------------------- */
  function renderScanTab() {
    var root = $("#tab-scan");
    root.innerHTML = "";
    var hero = el("div", { class: "scan-hero" });
    hero.appendChild(el("div", { class: "laser" }));
    hero.appendChild(el("h2", { text: "Scan or enter a barcode" }));
    hero.appendChild(el("p", { class: "hint", text: "Handheld scanners type straight into the field. Or use the camera, or type the code and tap the arrow." }));
    var form = el("form", { class: "scan-form" });
    var input = el("input", { type: "text", inputmode: "numeric", enterkeyhint: "go", autocomplete: "off", placeholder: "Barcode", id: "scanInput" });
    // The iPhone number pad has no Enter key, so typed barcodes need a button
    var goBtn = el("button", { type: "submit", class: "icon-btn go", title: "Find barcode", "aria-label": "Find barcode" });
    goBtn.appendChild(arrowIcon());
    goBtn.hidden = true;
    input.addEventListener("input", function () { goBtn.hidden = !input.value.trim(); });
    var camBtn = el("button", { type: "button", class: "icon-btn", title: "Scan with camera" });
    camBtn.appendChild(cameraIcon());
    form.appendChild(input);
    form.appendChild(goBtn);
    form.appendChild(camBtn);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      goBtn.hidden = true;
      // Typed on the on-screen keypad: close it so the product card is visible.
      // Handheld scanners press Enter instead and keep focus for the next scan.
      var typed = e.submitter === goBtn;
      handleScan(input.value).then(function () { if (typed) input.blur(); });
    });
    camBtn.addEventListener("click", openCameraScanner);
    hero.appendChild(form);
    root.appendChild(hero);

    root.appendChild(el("div", { id: "recountBanner" }));
    renderRecountBanner();
    var scannedHolder = el("div", { id: "scannedHolder" });
    root.appendChild(scannedHolder);

    if (state.currentScan) renderScannedCard();

    // Ready the barcode box, unless someone is already typing somewhere else
    // (a quantity on a card that just opened): taking focus would move their typing
    setTimeout(function () {
      var i = $("#scanInput"), a = document.activeElement;
      if (i && (!a || a === document.body || !$("#tab-scan").contains(a))) i.focus();
    }, 50);
  }

  function arrowIcon() {
    var wrap = el("div");

  async function handleScan(rawCode) {
    var code = (rawCode || "").trim();
    if (!code) return;
    var id = sanitizeId(code);
    var input = $("#scanInput");
    if (input) { input.value = ""; input.focus(); }

    if (!state.catalog && state.catalogLoading) { toast("The product list is still loading \u2014 try again in a moment"); return; }
    var item = state.catalog && state.catalog.items[id];
    var product = null;
    var extra = state.extras[id];

    if (item) {
      // One read: this item's current count, if anyone has counted it
      var count = null;
      try { count = await SC.getCount(id); } catch (e) { console.warn("count lookup failed", e); }
      product = { barcode: item.barcode, description: item.description, count: count };
    } else if (!extra && state.dbApi) {
      try {
        var esnap = await state.dbApi.doc("extras/" + id).get();
        if (esnap.exists) extra = esnap.data();
      } catch (e) {}
    }

    state.currentScan = { id: id, barcode: code, product: product, extra: extra || null };
    renderScannedCard();
  }

  function renderScannedCard() {
    var holder = $("#scannedHolder");
    if (!holder) return;
    holder.innerHTML = "";
    var sc = state.currentScan;
    if (!sc) return;

    var rec = state.recounts[sc.id];
    if (sc.product && rec && rec.status === "open" && rec.firstByUid !== state.user.uid) {
      // Recount: count again without seeing the first number
      var rcard = el("div", { class: "scanned-card recount" });
      rcard.appendChild(el("div", { class: "sc-barcode mono", text: sc.barcode }));
      rcard.appendChild(el("div", { class: "sc-desc", text: sc.product.description || "(no description)" }));
      rcard.appendChild(el("div", { class: "banner", text: "Recount requested. Count this item again from scratch \u2014 the earlier number is hidden on purpose." }));
      var rq = buildQtyRow("");
      rcard.appendChild(rq.row);
      var rbtn = el("button", { class: "btn btn-primary btn-block", text: "Save recount" });
      rbtn.addEventListener("click", function () {
        if (!rq.row.querySelector("input").value.trim()) { toast("Enter a quantity"); return; }
        saveRecount(sc, rec, rq.getValue());
      });
      rcard.appendChild(el("div", { class: "save-row" }, [rbtn]));
      holder.appendChild(rcard);
      return;
    }
    if (sc.product) {
      var p = sc.product;
      var card = el("div", { class: "scanned-card found" });
      card.appendChild(el("div", { class: "sc-barcode mono", text: sc.barcode }));
      card.appendChild(el("div", { class: "sc-desc", text: p.description || "(no description)" }));
      var qtyRow = buildQtyRow(p.count ? p.count.qty : "");
      card.appendChild(qtyRow.row);
      var saveRow = el("div", { class: "save-row" });
      var saveBtn = el("button", { class: "btn btn-primary btn-block", text: "Save count" });
      saveBtn.addEventListener("click", function () { saveProductCount(sc.id, qtyRow.getValue()); });
      saveRow.appendChild(saveBtn);
      card.appendChild(saveRow);
      if (p.count) {
        card.appendChild(el("div", { class: "last-counted", text: "Last counted " + p.count.qty + " by " + (p.count.by || "someone") + (p.count.at ? " on " + fmtWhen(p.count.at) : "") }));
      }
      if (rec) card.appendChild(el("div", { class: "last-counted", text: rec.status === "open"
        ? "A recount has been requested. Someone else needs to count this item."
        : "Recounted by " + (rec.recountBy || "someone") + " \u2014 waiting for an admin to decide." }));
      holder.appendChild(card);
    } else if (sc.extra) {
      var ex = sc.extra;
      var card2 = el("div", { class: "scanned-card extra" });
      var topRow2 = el("div", { class: "sc-top-row" }, [
        el("div", { class: "sc-barcode mono", text: sc.barcode }),
        el("span", { class: "badge badge-extra", text: "Extra item" })
      ]);
      card2.appendChild(topRow2);
      card2.appendChild(el("div", { class: "sc-desc", text: ex.description || "(no description)" }));
      var qtyRow2 = buildQtyRow(ex.qty != null ? ex.qty : "");
      card2.appendChild(qtyRow2.row);
      var saveRow2 = el("div", { class: "save-row" });
      var saveBtn2 = el("button", { class: "btn btn-primary btn-block", text: "Update count" });
      saveBtn2.addEventListener("click", function () { saveExtra(sc.id, sc.barcode, ex.description, qtyRow2.getValue()); });
      saveRow2.appendChild(saveBtn2);
      card2.appendChild(saveRow2);
      holder.appendChild(card2);
    } else {
      var card3 = el("div", { class: "scanned-card unknown" });
      card3.appendChild(el("div", { class: "sc-barcode mono", text: sc.barcode }));
      card3.appendChild(el("div", { class: "unknown-msg", text: "Not on the product list. Add it as an extra item found in stock." }));
      var descInput = el("input", { type: "text", class: "extra-desc-input", placeholder: "Description of this item" });
      card3.appendChild(descInput);
      var qtyRow3 = buildQtyRow("");
      card3.appendChild(qtyRow3.row);
      var saveRow3 = el("div", { class: "save-row" });
      var saveBtn3 = el("button", { class: "btn btn-primary btn-block", text: "Add extra item" });
      saveBtn3.addEventListener("click", function () {
        var desc = descInput.value.trim();
        if (!desc) { toast("Enter a description first"); return; }
        saveExtra(sc.id, sc.barcode, desc, qtyRow3.getValue());
      });
      saveRow3.appendChild(saveBtn3);
      card3.appendChild(saveRow3);
      holder.appendChild(card3);
    }
  }

  function buildQtyRow(initial) {
    var row = el("div", { class: "qty-row" });
    var minus = el("button", { type: "button", text: "\u2212" });
    var input = el("input", { type: "number", inputmode: "numeric", min: "0", value: initial === "" ? "" : String(initial) });
    var plus = el("button", { type: "button", text: "+" });
    minus.addEventListener("click", function () {
      var v = parseInt(input.value, 10); if (isNaN(v)) v = 0; v = Math.max(0, v - 1); input.value = v;
    });
    plus.addEventListener("click", function () {
      var v = parseInt(input.value, 10); if (isNaN(v)) v = 0; v = v + 1; input.value = v;
    });
    row.appendChild(minus); row.appendChild(input); row.appendChild(plus);
    return { row: row, getValue: function () {
      var v = parseInt(input.value, 10);
      return isNaN(v) ? 0 : v;
    } };
  }

  async function saveRecount(sc, rec, qty) {
    if (sc.saving) return;
    sc.saving = true;
    try {
      await SC.saveRecount(sc.id, rec, qty);
      toast("Recount saved: " + qty);
      if (state.currentScan === sc) { state.currentScan = null; renderScannedCard(); }
    } catch (e) {
      toast("Couldn't save: " + SC.friendlyError(e));
    } finally {
      sc.saving = false;
    }
  }

  async function saveProductCount(id, qty) {
    if (!state.dbApi) { toast("Not connected \u2014 can't save"); return; }
    var sc = state.currentScan;
    if (!sc || sc.id !== id || !sc.product || sc.saving) return;
    sc.saving = true; // a double tap must not count the item twice
    try {
      await SC.saveCount({ id: id, barcode: sc.product.barcode, description: sc.product.description }, qty, sc.product.count);
      toast("Saved: " + qty);
      if (state.currentScan === sc) {
        sc.product.count = { qty: qty, by: state.user.name, byUid: state.user.uid, at: nowIso() };
        renderScannedCard();
      }
    } catch (e) {
      toast("Couldn't save: " + (e && e.code ? e.code : "error"));
    } finally {
      sc.saving = false;
    }
  }

  async function saveExtra(id, barcode, description, qty) {
    if (!state.dbApi) { toast("Not connected \u2014 can't save"); return; }
    try {
      var before = state.extras[id];
      await state.dbApi.doc("extras/" + id).set({
        barcode: barcode, description: description, qty: qty,
        addedBy: state.staffName || "Staff", addedByUid: state.user.uid, addedAt: nowIso()
      });
      toast("Saved: " + qty);
      SC.log("extra_added", { barcode: barcode, description: description, qty: qty, prevQty: before ? before.qty : null });
    } catch (e) {
      toast("Couldn't save: " + (e && e.code ? e.code : "error"));
    }
  }

  /* ---------------------------------------------------------------
   * Camera scanning (ZXing) - optional, degrades gracefully
   * ------------------------------------------------------------- */
  var zxingReader = null;
  var zxingStream = null;
  function openCameraScanner() {
    var nativeScanner = nativePlugin("CapacitorBarcodeScanner");
    if (nativeScanner) {
      // iOS app: full-screen system camera scanner
      nativeScanner.scanBarcode({
        hint: 17, // all barcode formats
        scanInstructions: "Point the camera at a barcode",
        scanButton: false,
        cameraDirection: 1, // back camera
        scanOrientation: 3  // follow device orientation
      }).then(function (res) {
        if (res && res.ScanResult) handleScan(res.ScanResult);
      }).catch(function (e) {
        var msg = String((e && (e.message || e.code)) || "");
        if (/cancel/i.test(msg)) return;
        toast("Couldn't scan: " + (msg || "error"));
      });
      return;
    }
    if (typeof ZXing === "undefined") {
      toast("Camera scanning isn't available here \u2014 type the barcode instead");
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast("This browser can't offer camera access here \u2014 type the barcode instead");
      return;
    }
    var overlay = el("div", { class: "modal-overlay", id: "camOverlay" });
    var modal = el("div", { class: "modal" });
    modal.appendChild(el("h3", { text: "Scan a barcode" }));
    var camWrap = el("div", { class: "cam-wrap" });
    var video = el("video");
    video.setAttribute("autoplay", "");
    video.setAttribute("playsinline", "");
    video.muted = true;
    video.playsInline = true;
    camWrap.appendChild(video);
    camWrap.appendChild(el("div", { class: "corner tl" }));
    camWrap.appendChild(el("div", { class: "corner tr" }));
    camWrap.appendChild(el("div", { class: "corner bl" }));
    camWrap.appendChild(el("div", { class: "corner br" }));
    modal.appendChild(camWrap);
    var status = el("p", { text: "Requesting camera access\u2026" });
    modal.appendChild(status);
    var retryRow = el("div", { class: "btn-row", style: "margin-bottom:8px", id: "camRetryRow" });
    modal.appendChild(retryRow);
    var closeBtn = el("button", { class: "btn btn-secondary btn-block", text: "Cancel" });
    closeBtn.addEventListener("click", closeCameraScanner);
    modal.appendChild(closeBtn);
    overlay.appendChild(modal);
    $("#modalRoot").appendChild(overlay);

    function tryStart(constraints, label) {
      try {
        zxingReader = new ZXing.BrowserMultiFormatReader();
        zxingReader.decodeFromConstraints(
          constraints,
          video,
          function (result) {
            if (result) {
              var text = result.getText();
              closeCameraScanner();
              handleScan(text);
            }
          }
        ).then(function (controls) {
          status.textContent = "Point your camera at a barcode";
          retryRow.innerHTML = "";
          zxingStream = controls;
        }).catch(function (e) {
          handleCamError(e, label);
        });
      } catch (e) {
        handleCamError(e, label);
      }
    }

    function handleCamError(e, label) {
      var name = (e && e.name) || "Error";
      retryRow.innerHTML = "";
      if (name === "NotAllowedError" || name === "SecurityError") {
        status.textContent = "Camera access was blocked (" + name + "). If your browser or app just asked for permission, allow it and try again \u2014 otherwise check camera permissions in your browser or device settings.";
        var retryBtn = el("button", { class: "btn btn-primary", text: "Try again" });
        retryBtn.addEventListener("click", function () { tryStart({ video: { facingMode: { ideal: "environment" } } }, "environment"); });
        retryRow.appendChild(retryBtn);
      } else if (name === "OverconstrainedError" || name === "ConstraintNotSatisfiedError") {
        status.textContent = "That camera isn't available. Trying another camera\u2026";
        tryStart({ video: true }, "any");
      } else if (name === "NotFoundError" || name === "DevicesNotFoundError") {
        status.textContent = "No camera was found on this device.";
      } else {
        status.textContent = "Couldn't access the camera (" + name + "). You can type the barcode instead.";
      }
    }

    tryStart({ video: { facingMode: { ideal: "environment" } } }, "environment");
  }
  function closeCameraScanner() {
    try { if (zxingReader) zxingReader.reset(); } catch (e) {}
    zxingReader = null; zxingStream = null;
    var o = $("#camOverlay");
    if (o) o.remove();
  }

   * LIST TAB
   * ------------------------------------------------------------- */
  var LIST_LIMIT = 100;

  function renderListTab() {
    var root = $("#tab-list");
    root.innerHTML = "";
    var panel = el("div", { class: "panel" });
    panel.appendChild(el("h2", { text: "Items" }));

    var filterRow = el("div", { class: "filter-row" });
    var nRecount = recountsForMe().length;
    var filters = [["all", "Search list"], ["recent", "Recently counted"]];
    if (nRecount || state.listFilter === "recount") filters.push(["recount", "To recount (" + nRecount + ")"]);
    filters.forEach(function (f) {
      var b = el("button", { text: f[1] });
      if (state.listFilter === f[0]) b.classList.add("active");
      b.addEventListener("click", function () { state.listFilter = f[0]; renderListTab(); });
      filterRow.appendChild(b);
    });
    panel.appendChild(filterRow);

    if (state.listFilter === "all") {
      var search = el("input", { class: "search-input", type: "search", placeholder: "Search barcode or description", value: state.listSearch });
      search.addEventListener("input", function () { state.listSearch = search.value; renderListRows(); });
      panel.appendChild(search);
    }

    var listHolder = el("div", { id: "listHolder" });
    panel.appendChild(listHolder);
    root.appendChild(panel);
    renderListRows();
  }

  function itemRow(barcode, description, qty, pill, pillClass) {
    var counted = qty !== null && qty !== undefined;
    var row = el("div", { class: "item-row" + (counted ? " counted" : "") });
    var info = el("div", { class: "info" });
    info.appendChild(el("div", { class: "desc", text: description || "(no description)" }));
    info.appendChild(el("div", { class: "code mono", text: barcode }));
    row.appendChild(info);
    if (pill) row.appendChild(el("span", { class: pillClass || "status-pill", text: pill }));
    row.appendChild(el("div", { class: "qty" + (counted ? "" : " dash"), text: counted ? String(qty) : "›" }));
    row.addEventListener("click", function () { switchTab("scan"); handleScan(barcode); });
    return row;
  }

  function renderListRows() {
    var holder = $("#listHolder");
    if (!holder) return;
    holder.innerHTML = "";

    if (state.listFilter === "recount") {
      var todo = recountsForMe();
      if (!todo.length) { holder.appendChild(el("div", { class: "empty-note", text: "Nothing to recount." })); return; }
      holder.appendChild(el("div", { class: "hint", style: "margin:0 0 8px", text: "Tap an item and count it again from scratch. The earlier number is hidden on purpose." }));
      todo.forEach(function (r) { holder.appendChild(itemRow(r.barcode, r.description, null, "Recount")); });
      return;
    }

    if (state.listFilter === "recent") {
      if (!state.recent.length) { holder.appendChild(el("div", { class: "empty-note", text: "Nothing counted yet." })); return; }
      state.recent.forEach(function (c) {
        if (hideQty(c.id)) holder.appendChild(itemRow(c.barcode, c.description, null, "Recount"));
        else holder.appendChild(itemRow(c.barcode, c.description, c.qty, (c.by || "") + " · " + fmtWhen(c.at)));
      });
      var extraIds = Object.keys(state.extras);
      if (extraIds.length) {
        holder.appendChild(el("div", { class: "hint", style: "margin:14px 0 4px", text: "Extra items found (not on the list)" }));
        extraIds.forEach(function (id) {
          var ex = state.extras[id];
          holder.appendChild(itemRow(ex.barcode || id, ex.description, ex.qty, "Extra", "badge badge-extra"));
        });
      }
      return;
    }

    var cat = state.catalog;
    if (!cat) {
      holder.appendChild(el("div", { class: "empty-note", text: state.catalogLoading ? "Loading the product list…" : (state.catalogError || "No product list yet.") }));
      return;
    }
    // Counts we already know about (recent ones), so those rows can show their quantity
    var known = {};
    state.recent.forEach(function (c) { known[c.id] = c; });
    var q = state.listSearch.trim().toLowerCase();
    var shown = 0, matches = 0;
    for (var i = 0; i < cat.order.length; i++) {
      var id = cat.order[i], it = cat.items[id];
      if (q && it.barcode.toLowerCase().indexOf(q) === -1 && it.description.toLowerCase().indexOf(q) === -1) continue;
      matches++;
      if (shown < LIST_LIMIT) {
        var c = known[id];
        if (hideQty(id)) holder.appendChild(itemRow(it.barcode, it.description, null, "Recount"));
        else holder.appendChild(itemRow(it.barcode, it.description, c ? c.qty : null, c ? "Counted" : null));
        shown++;
      }
    }
    if (!matches) { holder.appendChild(el("div", { class: "empty-note", text: "No items match." })); return; }
    holder.insertBefore(el("div", { class: "hint", style: "margin:0 0 8px", text: matches > shown
      ? "Showing " + shown + " of " + matches.toLocaleString() + " items — type more of the barcode or name to narrow it down. Tap an item to count it."
      : matches.toLocaleString() + (matches === 1 ? " item" : " items") + ". Tap an item to see or change its count." }), holder.firstChild);
  }

  function renderManageStatus() {
    var panel = $("#manageStatusPanel");

    panel.innerHTML = "";

  function handleFileSelected(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, { type: "array" });
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });
        rows = rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ""; }); });
        if (!rows.length) { toast("That file looks empty"); return; }
        var headerRow = rows[0];
        var dataRows = rows.slice(1);
        var guess = guessColumns(headerRow);
        importState = { rows: dataRows, headerRow: headerRow, barcodeCol: guess.barcodeCol, descCol: guess.descCol, fileName: file.name };
        renderImportMap();
      } catch (err) {
        toast("Couldn't read that file");
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function guessColumns(headerRow) {
    var barcodeRe = /barcode|bar code|code|sku|ean|upc/i;
    var descRe = /desc|name|item|product|title/i;
    var barcodeCol = 0, descCol = headerRow.length > 1 ? 1 : 0;
    headerRow.forEach(function (h, i) { if (barcodeRe.test(String(h))) barcodeCol = i; });
    headerRow.forEach(function (h, i) { if (descRe.test(String(h))) descCol = i; });
    return { barcodeCol: barcodeCol, descCol: descCol };
  }

  function renderImportMap() {
    var holder = $("#importMapHolder");
    holder.innerHTML = "";
    if (!importState) return;

    if (importState.rows.length > SC.MAX_ITEMS) {
      holder.appendChild(el("div", { class: "banner warn", text: "This file has " + importState.rows.length.toLocaleString() + " rows. Only the first " + SC.MAX_ITEMS.toLocaleString() + " will be imported." }));
    }

    var colOptions = importState.headerRow.map(function (h, i) { return { i: i, label: (h || "(column " + (i + 1) + ")") }; });

    var barcodeField = el("div", { class: "field" }, [
      el("label", { text: "Barcode column" }),
      buildColSelect(colOptions, importState.barcodeCol, function (v) { importState.barcodeCol = v; renderPreview(); })
    ]);
    var descField = el("div", { class: "field" }, [
      el("label", { text: "Description column" }),
      buildColSelect(colOptions, importState.descCol, function (v) { importState.descCol = v; renderPreview(); })
    ]);
    holder.appendChild(barcodeField);
    holder.appendChild(descField);

    var previewHolder = el("div", { id: "previewHolder" });
    holder.appendChild(previewHolder);

    var confirmBtn = el("button", { class: "btn btn-primary btn-block", text: "Start new stock check with this list" });
    confirmBtn.addEventListener("click", confirmImport);
    holder.appendChild(confirmBtn);

    renderPreview();
  }

  function buildColSelect(options, selected, onChange) {
    var sel = el("select");
    options.forEach(function (o) {
      var opt = el("option", { value: String(o.i), text: o.label });
      if (o.i === selected) opt.setAttribute("selected", "selected");
      sel.appendChild(opt);
    });
    sel.addEventListener("change", function () { onChange(parseInt(sel.value, 10)); });
    return sel;
  }

  function renderPreview() {
    var holder = $("#previewHolder");
    if (!holder || !importState) return;
    holder.innerHTML = "";
    var wrap = el("div", { class: "table-wrap" });
    var table = el("table", { class: "preview" });
    var thead = el("thead", {}, [el("tr", {}, [el("th", { text: "Barcode" }), el("th", { text: "Description" })])]);
    var tbody = el("tbody");
    importState.rows.slice(0, 5).forEach(function (r) {
      tbody.appendChild(el("tr", {}, [
        el("td", { class: "mono", text: r[importState.barcodeCol] || "" }),
        el("td", { text: r[importState.descCol] || "" })
      ]));
    });
    table.appendChild(thead); table.appendChild(tbody);
    wrap.appendChild(table);
    holder.appendChild(wrap);
    holder.appendChild(el("p", { class: "hint", text: importState.rows.length + " rows detected. Preview of first 5." }));
  }

  async function confirmImport() {
    if (!importState) return;
    if (!state.dbApi) { toast("Not connected — can't import"); return; }
    var ok = window.confirm("Starting a new stock check clears any counts already saved. Continue?");
    if (!ok) return;
    var im = importState;
    var rows = im.rows.map(function (r) { return { barcode: r[im.barcodeCol], description: r[im.descCol] }; });
    try {
      var n = await SC.importList(rows, im.fileName, state.session, toast);
      importState = null;
      $("#importMapHolder").innerHTML = "";
      toast("Stock check started with " + n.toLocaleString() + " products");
      if (state.activeTab === "manage") switchTab("scan");
    } catch (e) {
      toast("Import failed: " + SC.friendlyError(e));
    }
  }

  async function resetCounts() {
    if (!state.dbApi) { toast("Not connected"); return; }
    if (!state.counted) { toast("Nothing to reset"); return; }
    var ok = window.confirm("Set every item's counted quantity back to not-counted? This keeps the product list.");
    if (!ok) return;
    toast("Resetting…");
    try {
      await SC.resetCounts(function (done, total) { toast("Resetting " + done.toLocaleString() + " of " + total.toLocaleString() + "…"); });
      toast("Counts reset");
    } catch (e) {
      toast("Couldn't reset: " + SC.friendlyError(e));
    }
  }

  // Removes the list, counts, extra items and session to start fresh
  async function deleteStockCheck() {
    if (!state.dbApi) { toast("Not connected"); return; }
    var nProducts = state.session ? state.session.totalProducts || 0 : 0, nExtras = Object.keys(state.extras).length;
    if (!state.session && !nExtras) { toast("There's no stock check to delete"); return; }
    var typed = window.prompt("This permanently deletes the product list (" + SC.plural(nProducts, "item") + "), all counts and " +
      SC.plural(nExtras, "extra item") + ". Staff accounts and the activity log are kept.\n\nType DELETE to confirm:");
    if (typed === null) return;
    if (typed.trim().toUpperCase() !== "DELETE") { toast("Not deleted — you need to type DELETE"); return; }
    toast("Deleting…");
    try {
      var n = await SC.deleteStockCheck(state.session);
      state.currentScan = null;
      importState = null;
      toast("Deleted " + SC.plural(n.products, "product") + " and " + SC.plural(n.extras, "extra item"));
    } catch (e) {
      toast("Couldn't delete: " + SC.friendlyError(e));
    }
  }

  async function exportResults() {
    if (!state.downloadsApi) { toast("Downloads aren't available in this view"); return; }
    if (!state.catalog) { toast(state.catalogLoading ? "The product list is still loading" : "No product list to export"); return; }
    toast("Preparing export\u2026");
    var counts;
    try { counts = await SC.fetchAllCounts(); } catch (e) { toast("Couldn't export: " + SC.friendlyError(e)); return; }
    var aoa = [["Barcode", "Description", "Counted Qty", "Status", "Counted By", "Counted At"]];
    state.catalog.order.forEach(function (id) {
      var it = state.catalog.items[id], c = counts[id];
      aoa.push([it.barcode, it.description, c ? c.qty : "", c ? "Counted" : "Not counted", c ? c.by || "" : "", c && c.at ? fmtWhen(c.at) : ""]);
    });
    var extraIds = Object.keys(state.extras);
    if (extraIds.length) {
      aoa.push([]);
      aoa.push(["Extra items (not on original list)"]);
      aoa.push(["Barcode", "Description", "Qty", "Added By", "Added At"]);
      extraIds.forEach(function (id) {
        var ex = state.extras[id];
        aoa.push([ex.barcode || id, ex.description || "", ex.qty, ex.addedBy || "", ex.addedAt ? fmtWhen(ex.addedAt) : ""]);
      });
    }
    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, "Stock check");
    var wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    var blob = new Blob([wbout], { type: "application/octet-stream" });
    var fname = "stock-check-" + new Date().toISOString().slice(0, 10) + ".xlsx";
    try {
      await state.downloadsApi.save({ filename: fname, data: blob });
      toast("Exported");
      SC.log("export", { detail: fname });
    } catch (e) {
      if (e && e.code === "declined") return;
      toast("Couldn't export: " + (e && e.code ? e.code : "error"));
    }
  }

  /* ---------------------------------------------------------------
   * Boot
   * ------------------------------------------------------------- */
  $all("nav.tabs button").forEach(function (b) {
    b.addEventListener("click", function () { switchTab(b.dataset.tab); });
  });
  $("#staffChip").addEventListener("click", function () {
    if (state.user) openAccountMenu(); else showAuthScreen("");
  });

  (async function boot() {
    // Computers get the desktop dashboard; add ?mobile to the URL to stay here
    if (!SC.isNative() && window.matchMedia("(min-width: 1024px)").matches && !/[?&]mobile\b/.test(location.search)) {
      location.replace("dashboard.html");
      return;
    }
    await initCapabilities();
    renderStaffChip();
    switchTab("scan");
    if (state.dbApi) {
      var authHeard = false;
      SC.onAuth(function (profile, error) { authHeard = true; onAuthChanged(profile, error); },
        // Signed in from last time: wait for it rather than showing the sign-in screen
        function () { authHeard = true; });
      // If the sign-in service is slow to answer, show the sign-in screen anyway
      // rather than leaving the app on "Loading..."
      setTimeout(function () { if (!authHeard && !state.user) showAuthScreen(""); }, 4000);
    }
  })();
})();
</script>
</body>
</html>
